{% extends "base.html" %}
{% from "macros.html" import csrf %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-card mx-auto mt-5">
    <div class="text-center mb-4">
        <i class="bi bi-bug-fill text-danger fs-1"></i>
        <h1 class="h4 mt-2">Sign in to Bug Tracker</h1>
    </div>
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form method="post">
                {{ csrf() }}
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ email }}" required autofocus autocomplete="username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" name="remember" id="remember" value="1">
                    <label class="form-check-label" for="remember">Keep me signed in</label>
                </div>
                <button class="btn btn-primary w-100">Sign in</button>
            </form>
        </div>
    </div>
    <p class="text-center text-body-secondary small mt-3">No account or forgot your password? Ask an admin.</p>
</div>
{% endblock %}
